name: moltbook-proxy
on:
  push:
    branches: [ main ]
    paths: [ "moltbook_task.json", ".github/workflows/moltbook.yml" ]
jobs:
  proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Execute moltbook API calls
        run: |
          set -euo pipefail
          AUTH=$(python3 -c "import json;print(json.load(open(\"moltbook_task.json\")).get(\"auth\",\"\"))")
          python3 - <<"PY" > /tmp/calls.sh
          import json
          t = json.load(open("moltbook_task.json"))
          print("set -euo pipefail")
          for i, c in enumerate(t.get("calls", [])):
              m = c.get("method","GET"); p = c.get("path","/agents/status")
              b = json.dumps(c.get("body",{}))
              line = f"echo \\"===== CALL {i} {m} {p} =====\\""
              print(line)
              args = "-X " + m if m != "GET" else ""
              if b != "{}" and b: args += f" -H \\"Content-Type: application/json\\" -d \\"{b}\\""
              if AUTH: args += " -H \\"Authorization: Bearer " + AUTH + "\\""
              print(f"curl -sS -m 60 -w \\"\\\\n__HTTP:%{{http_code}}\\" {args} \\"https://www.moltbook.com/api/v1{p}\\" || true")
          PY
          bash /tmp/calls.sh
          git config user.name "moltbook-proxy"
          git config user.email "moltbook-proxy@users.noreply.github.com"
          git checkout -B moltbook-proxy
          bash /tmp/calls.sh > moltbook_result.txt 2>&1 || true
          git add moltbook_result.txt
          git commit -m "moltbook result $(date -u +%s)" || true
          git push origin moltbook-proxy --force
